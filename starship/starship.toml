# Starship Configuration - Tokyo Night Storm Theme
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

format = """
$os\
$directory\
$git_branch\
$git_status\
$golang\
$nodejs\
$python\
$rust\
$package\
$cmd_duration\
$line_break\
$character"""

# Palettes
palette = "tokyonight_storm"

[palettes.tokyonight_storm]
bg = "#24283b"
fg = "#c0caf5"
blue = "#7aa2f7"
cyan = "#7dcfff"
green = "#9ece6a"
orange = "#ff9e64"
purple = "#bb9af7"
red = "#f7768e"
yellow = "#e0af68"
gray = "#565f89"

[character]
success_symbol = "[❯](bold blue)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[directory]
style = "bold cyan"
truncation_length = 4
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "red"

[git_branch]
symbol = " "
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "󰞇 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "? "
stashed = "󰓗 "
modified = "! "
staged = "+ "
renamed = "» "
deleted = "✘ "

[cmd_duration]
min_time = 2_000
style = "bold yellow"
format = "took [$duration]($style) "

[golang]
symbol = " "
style = "bold cyan"
format = "via [$symbol($version )]($style)"

[nodejs]
symbol = " "
style = "bold green"
format = "via [$symbol($version )]($style)"

[python]
symbol = " "
style = "bold yellow"
format = 'via [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[rust]
symbol = "󱘗 "
style = "bold orange"
format = "via [$symbol($version )]($style)"

[package]
symbol = "󰏗 "
style = "bold gray"
format = "is [$symbol$version]($style) "

[os]
disabled = false
style = "bold blue"

[os.symbols]
Windows = "󰍲 "
Debian = " "
Ubuntu = " "
Linux = " "
